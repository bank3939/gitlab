<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860">
  <defs>
    <style>
      .bg{fill:#fbfcfe}
      .title{font:700 28px Arial,sans-serif;fill:#102a43}
      .sub{font:600 18px Arial,sans-serif;fill:#243b53}
      .sec{font:700 17px Arial,sans-serif;fill:#103658}
      .label{font:14px Arial,sans-serif;fill:#102a43}
      .small{font:13px Arial,sans-serif;fill:#334e68}
      .mono{font:13px Consolas,monospace;fill:#102a43}
      .wire{stroke:#102a43;stroke-width:2;fill:none;stroke-linecap:round}
      .res{stroke:#102a43;stroke-width:2;fill:#fff}
      .line{stroke:#9fb3c8;stroke-width:1.2}
      .accent{fill:#eef6fb}
      .ok{fill:#e9f7ec}
      .note{fill:#f8fafc}
    </style>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#102a43"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1400" height="860"/>
  <text class="title" x="30" y="42">ภาพประกอบการคำนวณ BJT DC Bias — รวม 3 โหมดในรูปเดียว (Fixed, Emitter, Voltage Divider)</text>
  <text class="small" x="30" y="68">ค่าร่วมอ้างอิงอิสระ: VCC=12 V, RC=2.2 kΩ (2200 Ω), β=100, VBE=0.70 V | หน่วย: V, Ω, A, mA | VCE(sat)=0.2 V, DC, NPN, กราวด์ 0 V (แยกขา)</text>
  <line class="line" x1="30" y1="82" x2="1370" y2="82"/>

  <!-- Column headers / unified layout -->
  <text class="sec" x="40" y="112">โหมด 1: Fixed Bias (A2)</text>
  <text class="sec" x="500" y="112">โหมด 2: Emitter Bias (A3, A4)</text>
  <text class="sec" x="960" y="112">โหมด 3: Voltage Divider Bias (A1, คงผลเดิม)</text>
  <line class="line" x1="470" y1="90" x2="470" y2="790"/>
  <line class="line" x1="930" y1="90" x2="930" y2="790"/>

  <!-- Fixed Bias circuit -->
  <text class="label" x="40" y="140">อินพุต: RB=1 MΩ (1,000,000 Ω), RE=0 (E ลงกราวด์ตรง)</text>
  <line class="wire" x1="80" y1="165" x2="360" y2="165"/><text class="small" x="190" y="158">VCC=12 V</text>
  <line class="wire" x1="360" y1="165" x2="360" y2="190"/>
  <rect class="res" x="345" y="190" width="30" height="35" rx="3"/><text class="label" x="382" y="212">RC 2.2 kΩ</text>
  <line class="wire" x1="360" y1="225" x2="360" y2="260"/>
  <text class="small" x="366" y="250">IC</text><line class="wire" x1="360" y1="238" x2="360" y2="252" marker-end="url(#arr)"/>
  <line class="wire" x1="360" y1="260" x2="330" y2="290"/><line class="wire" x1="330" y1="290" x2="360" y2="320"/>
  <line class="wire" x1="315" y1="280" x2="315" y2="330"/><line class="wire" x1="315" y1="305" x2="230" y2="305"/>
  <polygon points="352,312 360,320 348,323" fill="#102a43"/>
  <circle cx="335" cy="305" r="28" class="wire"/>
  <text class="label" x="370" y="300">β=100</text>
  <text class="small" x="250" y="296">IB→</text>
  <line class="wire" x1="230" y1="305" x2="230" y2="220"/>
  <rect class="res" x="215" y="185" width="30" height="35" rx="3"/><text class="label" x="150" y="207">RB 1 MΩ</text>
  <line class="wire" x1="230" y1="185" x2="230" y2="165"/><line class="wire" x1="230" y1="165" x2="80" y2="165"/>
  <line class="wire" x1="360" y1="320" x2="360" y2="365"/>
  <text class="small" x="366" y="350">IE</text><line class="wire" x1="360" y1="338" x2="360" y2="352" marker-end="url(#arr)"/>
  <line class="wire" x1="338" y1="365" x2="382" y2="365" style="stroke:#102a43;stroke-width:2.5"/><line class="wire" x1="346" y1="373" x2="374" y2="373" style="stroke:#102a43;stroke-width:2.5"/><line class="wire" x1="354" y1="381" x2="366" y2="381" style="stroke:#102a43;stroke-width:2.5"/>
  <text class="small" x="385" y="376">กราวด์ 0 V</text>
  <text class="small" x="372" y="268">VC</text><text class="small" x="372" y="332">VE=0 V</text>

  <rect class="accent" x="40" y="400" width="410" height="175" rx="6"/>
  <text class="sec" x="52" y="422">การคำนวณ (A2)</text>
  <text class="mono" x="52" y="446">IB = (VCC−VBE)/RB = (12−0.7)/1,000,000 = 11.3 µA</text>
  <text class="mono" x="52" y="468">IC = β·IB = 1.13 mA,  IE = (β+1)·IB = 1.1413 mA</text>
  <text class="mono" x="52" y="490">VE = 0 V,  VB = VBE = 0.70 V</text>
  <text class="mono" x="52" y="512">VC = VCC−IC·RC = 12−1.13m·2200 = 9.514 V</text>
  <text class="mono" x="52" y="534">VCE = VC−VE = 9.514 V</text>
  <rect class="ok" x="40" y="585" width="410" height="62" rx="6"/>
  <text class="mono" x="52" y="608">ผล: VB=0.70 V, VE=0 V, VC=9.514 V, VCE=9.514 V</text>
  <text class="mono" x="52" y="630">IC=1.13 mA, IB=11.3 µA, IE=1.1413 mA (Active)</text>

  <!-- Emitter Bias circuit -->
  <text class="label" x="500" y="140">อินพุต: RB=1 MΩ, RE=1 kΩ (A3) / 2 kΩ (A4)</text>
  <line class="wire" x1="540" y1="165" x2="820" y2="165"/><text class="small" x="650" y="158">VCC=12 V</text>
  <line class="wire" x1="820" y1="165" x2="820" y2="190"/>
  <rect class="res" x="805" y="190" width="30" height="35" rx="3"/><text class="label" x="842" y="212">RC 2.2 kΩ</text>
  <line class="wire" x1="820" y1="225" x2="820" y2="260"/>
  <text class="small" x="826" y="250">IC</text><line class="wire" x1="820" y1="238" x2="820" y2="252" marker-end="url(#arr)"/>
  <line class="wire" x1="820" y1="260" x2="790" y2="290"/><line class="wire" x1="790" y1="290" x2="820" y2="320"/>
  <line class="wire" x1="775" y1="280" x2="775" y2="330"/><line class="wire" x1="775" y1="305" x2="690" y2="305"/>
  <polygon points="812,312 820,320 808,323" fill="#102a43"/>
  <circle cx="795" cy="305" r="28" class="wire"/>
  <text class="label" x="830" y="300">β=100</text>
  <text class="small" x="710" y="296">IB→</text>
  <line class="wire" x1="690" y1="305" x2="690" y2="220"/>
  <rect class="res" x="675" y="185" width="30" height="35" rx="3"/><text class="label" x="610" y="207">RB 1 MΩ</text>
  <line class="wire" x1="690" y1="185" x2="690" y2="165"/><line class="wire" x1="690" y1="165" x2="540" y2="165"/>
  <line class="wire" x1="820" y1="320" x2="820" y2="350"/>
  <rect class="res" x="805" y="350" width="30" height="35" rx="3"/><text class="label" x="842" y="372">RE 1k/2kΩ</text>
  <line class="wire" x1="820" y1="385" x2="820" y2="420"/>
  <text class="small" x="826" y="408">IE</text><line class="wire" x1="820" y1="396" x2="820" y2="410" marker-end="url(#arr)"/>
  <line class="wire" x1="798" y1="420" x2="842" y2="420" style="stroke:#102a43;stroke-width:2.5"/><line class="wire" x1="806" y1="428" x2="834" y2="428" style="stroke:#102a43;stroke-width:2.5"/><line class="wire" x1="814" y1="436" x2="826" y2="436" style="stroke:#102a43;stroke-width:2.5"/>
  <text class="small" x="845" y="431">กราวด์ 0 V</text>
  <text class="small" x="832" y="268">VC</text><text class="small" x="832" y="340">VE</text>

  <rect class="accent" x="500" y="455" width="410" height="200" rx="6"/>
  <text class="sec" x="512" y="477">การคำนวณ (A3, A4)</text>
  <text class="mono" x="512" y="501">IB=(VCC−VBE)/(RB+(β+1)RE), IC=βIB, IE=(β+1)IB</text>
  <text class="mono" x="512" y="523">VE=IE·RE, VB=VE+VBE, VC=VCC−IC·RC, VCE=VC−VE</text>
  <text class="small" x="512" y="549">A3 (RE=1 kΩ): IB=10.2634 µA, IC=1.02634 mA, IE=1.03660 mA</text>
  <text class="small" x="512" y="569">VB=1.73660 V, VE=1.03660 V, VC=9.74205 V, VCE=8.70545 V</text>
  <text class="small" x="512" y="593">A4 (RE=2 kΩ): IB=9.4010 µA, IC=0.94010 mA, IE=0.94950 mA</text>
  <text class="small" x="512" y="613">VB=2.59900 V, VE=1.89900 V, VC=9.93178 V, VCE=8.03278 V</text>
  <text class="small" x="512" y="637">(RE เพิ่มขึ้น → ตัวหารเพิ่ม → IB,IC ลดลง ถูกต้องตามหลัก)</text>
  <rect class="ok" x="500" y="665" width="410" height="62" rx="6"/>
  <text class="mono" x="512" y="688">A3: IC=1.02634 mA, VCE=8.70545 V | A4: IC=0.94010 mA, VCE=8.03278 V</text>
  <text class="mono" x="512" y="710">ทั้งสองกรณี Active (IB&gt;0, VCE&gt;0.2 V)</text>

  <!-- Voltage Divider circuit -->
  <text class="label" x="960" y="140">อินพุต: R1=100 kΩ, R2=22 kΩ, RE=1 kΩ (A1)</text>
  <line class="wire" x1="1000" y1="165" x2="1280" y2="165"/><text class="small" x="1110" y="158">VCC=12 V</text>
  <line class="wire" x1="1280" y1="165" x2="1280" y2="190"/>
  <rect class="res" x="1265" y="190" width="30" height="35" rx="3"/><text class="label" x="1302" y="212">RC 2.2 kΩ</text>
  <line class="wire" x1="1280" y1="225" x2="1280" y2="260"/>
  <text class="small" x="1286" y="250">IC</text><line class="wire" x1="1280" y1="238" x2="1280" y2="252" marker-end="url(#arr)"/>
  <line class="wire" x1="1280" y1="260" x2="1250" y2="290"/><line class="wire" x1="1250" y1="290" x2="1280" y2="320"/>
  <line class="wire" x1="1235" y1="280" x2="1235" y2="330"/><line class="wire" x1="1235" y1="305" x2="1150" y2="305"/>
  <polygon points="1272,312 1280,320 1268,323" fill="#102a43"/>
  <circle cx="1255" cy="305" r="28" class="wire"/>
  <text class="label" x="1290" y="300">β=100</text>
  <text class="small" x="1170" y="296">IB→</text>
  <circle cx="1150" cy="305" r="3" fill="#102a43"/><text class="small" x="1130" y="292">B</text>
  <line class="wire" x1="1150" y1="305" x2="1150" y2="235"/>
  <rect class="res" x="1135" y="190" width="30" height="45" rx="3"/><text class="label" x="1070" y="217">R1 100 kΩ</text>
  <line class="wire" x1="1150" y1="190" x2="1150" y2="165"/><line class="wire" x1="1150" y1="165" x2="1000" y2="165"/>
  <line class="wire" x1="1150" y1="305" x2="1150" y2="345"/>
  <rect class="res" x="1135" y="345" width="30" height="45" rx="3"/><text class="label" x="1075" y="372">R2 22 kΩ</text>
  <line class="wire" x1="1150" y1="390" x2="1150" y2="430"/>
  <line class="wire" x1="1128" y1="430" x2="1172" y2="430" style="stroke:#102a43;stroke-width:2.5"/><line class="wire" x1="1136" y1="438" x2="1164" y2="438" style="stroke:#102a43;stroke-width:2.5"/><line class="wire" x1="1144" y1="446" x2="1156" y2="446" style="stroke:#102a43;stroke-width:2.5"/>
  <text class="small" x="1175" y="441">กราวด์ 0 V</text>
  <line class="wire" x1="1280" y1="320" x2="1280" y2="360"/>
  <rect class="res" x="1265" y="360" width="30" height="35" rx="3"/><text class="label" x="1302" y="382">RE 1 kΩ</text>
  <line class="wire" x1="1280" y1="395" x2="1280" y2="430"/>
  <text class="small" x="1286" y="418">IE</text><line class="wire" x1="1280" y1="406" x2="1280" y2="420" marker-end="url(#arr)"/>
  <line class="wire" x1="1258" y1="430" x2="1302" y2="430" style="stroke:#102a43;stroke-width:2.5"/><line class="wire" x1="1266" y1="438" x2="1294" y2="438" style="stroke:#102a43;stroke-width:2.5"/><line class="wire" x1="1274" y1="446" x2="1286" y2="446" style="stroke:#102a43;stroke-width:2.5"/>
  <text class="small" x="1305" y="441">กราวด์ 0 V</text>

  <rect class="accent" x="960" y="455" width="410" height="200" rx="6"/>
  <text class="sec" x="972" y="477">การคำนวณ (A1, Thevenin) — ค่าเดิมคงไว้</text>
  <text class="mono" x="972" y="501">VTH=VCC·R2/(R1+R2)=12·22k/122k=2.16393 V</text>
  <text class="mono" x="972" y="523">RTH=R1||R2=18.03279 kΩ</text>
  <text class="mono" x="972" y="545">IB=(VTH−VBE)/(RTH+(β+1)RE)=12.2986 µA</text>
  <text class="mono" x="972" y="567">IC=βIB=1.22986 mA, IE=(β+1)IB=1.24216 mA</text>
  <text class="mono" x="972" y="589">VB=1.94216 V, VE=1.24216 V, VC=9.29431 V</text>
  <text class="mono" x="972" y="611">VCE=VC−VE=8.05216 V</text>
  <text class="small" x="972" y="637">ผลตรงกับก่อนปรับ Lab 03 → Divider ไม่เสียจากการเปลี่ยนแปลง</text>
  <rect class="ok" x="960" y="665" width="410" height="62" rx="6"/>
  <text class="mono" x="972" y="688">VB=1.94216 V, VE=1.24216 V, VC=9.29431 V</text>
  <text class="mono" x="972" y="710">VCE=8.05216 V, IC=1.22986 mA (Active)</text>

  <!-- Unified summary (no separate panels for modes) -->
  <line class="line" x1="30" y1="800" x2="1370" y2="800"/>
  <rect class="note" x="30" y="812" width="1340" height="38" rx="6"/>
  <text class="small" x="45" y="835">สรุปรวม (รูปเดียว): คำนวณถูกทั้ง 3 โหมด, หน่วยชัดเจน (V, Ω, A/mA), ค่าอ้างอิงอิสระ A1–A5 ครบ, Voltage Divider (A1) ให้ผลเดิม 1.22986 mA / 8.05216 V | สมมติฐาน: VBE(on) ตามอินพุต, β คงที่, VCE(sat)=0.2 V, IE=(β+1)IB, IC=βIB, ไม่คิด Early effect</text>
</svg>
